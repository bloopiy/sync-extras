name: Build and release

# Builds the .mpp and publishes it as a GitHub release whenever `version` in
# gradle.properties changes on main (or when run by hand from the Actions tab).
# Then updates patches-bundle.json so Morphe Manager sees the new version.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore: [ 'patches-bundle.json', 'README.md' ]

permissions:
  contents: write   # create releases, commit patches-bundle.json
  packages: read    # Morphe Gradle plugin comes from GitHub Packages

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: burrunan/gradle-cache-action@v3

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Uploads via the GitHub web UI drop the executable bit, so restore it.
          chmod +x gradlew
          ./gradlew :patches:buildAndroid generatePatchesList --no-daemon

      - name: Read version
        id: v
        run: echo "version=$(grep -E '^version *=' gradle.properties | sed 's/.*= *//')" >> "$GITHUB_OUTPUT"

      - name: Create release (skipped if it already exists)
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; bump version in gradle.properties to publish a new one."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MPP=$(ls patches/build/libs/patches-*.mpp | grep -v -e sources -e javadoc | head -1)
          gh release create "v$VERSION" "$MPP" --title "Sync Extras v$VERSION" --notes "Add-on patches for Sync for Reddit. Use with wchill/patcheddit."
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "asset=$(basename "$MPP")" >> "$GITHUB_OUTPUT"

      - name: Update patches-bundle.json
        if: steps.rel.outputs.created == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
          ASSET: ${{ steps.rel.outputs.asset }}
        run: |
          jq -n \
            --arg created "$(date -u +%Y-%m-%dT%H:%M:%S)" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/v$VERSION/$ASSET" \
            --arg version "$VERSION" \
            '{created_at: $created,
              description: "Sync Extras: Unlock Sync Ultra, Fix \"Restore Comment\" and Redgifs WebView fallback. Add-on for wchill/patcheddit (dev channel).",
              download_url: $url,
              version: $version}' > patches-bundle.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json
          git commit -m "chore: Release v$VERSION [skip ci]"
          git push
